[project]
name = "nullain-monorepo"
version = "0.1.0"
description = "Nullain Agent SDK Monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "nullain-sdk",
    "nullain-tools",
    "nullain-agentd",
]

[tool.uv.sources]
nullain-sdk = { workspace = true }
nullain-tools = { workspace = true }
nullain-agentd = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "hypothesis>=6.90.0",
    "ruff>=0.4.0",
    "pyright>=1.1.380",
    "pre-commit>=3.6.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"
]
ignore = [
    "S101", # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["nullain-sdk/src", "nullain-tools/src", "nullain-agentd/src", "tests"]
extraPaths = ["nullain-sdk/src", "nullain-tools/src", "nullain-agentd/src"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["nullain-sdk/src", "nullain-tools/src", "nullain-agentd/src"]
