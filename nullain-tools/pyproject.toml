[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nullain-tools"
version = "0.4.0"
description = "Built-in coding tools for the Nullain Agent SDK — paged reads, safe edits, ripgrep search, checkpoints and undo"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nullain" }]
keywords = ["agent", "ai", "llm", "tools", "coding-agent", "nullain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "nullain-sdk>=0.1.0",
    "pydantic>=2.7.0",
    "anyio>=4.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# web_fetch's Crawl4AI/Playwright rendering path (create_web_fetch_tool's
# use_crawl4ai=True). Optional: web_fetch works with plain httpx alone;
# _fetch_via_crawl4ai degrades to a clean failure (never raises) when this
# extra isn't installed, so the base install stays free of Playwright's
# Chromium download. `playwright install chromium` is still needed
# separately after installing this extra — pip can't run it for you.
crawl = ["crawl4ai>=0.4.0"]

[project.urls]
Homepage = "https://github.com/netty-linux/nullain-agent-sdk"
Repository = "https://github.com/netty-linux/nullain-agent-sdk"
Issues = "https://github.com/netty-linux/nullain-agent-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nullain_tools"]
