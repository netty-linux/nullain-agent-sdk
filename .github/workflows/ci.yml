name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Daily, independent of any commit — pypi-consumer-install below tests
    # what's actually live on PyPI, which can break with zero code change
    # here (a yanked version, index downtime, a transitive dependency
    # publishing a breaking release). A push-only trigger would miss that.
    - cron: "17 6 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and typecheck are platform-independent: running them once keeps the
  # matrix fast, and a formatting or typing error is not OS-specific.
  static:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

  # Proves the workspace resolves and installs from a cold start — no
  # Actions cache, no sibling repo, nothing carried over from a prior run.
  # `enable-cache: true` on the other jobs is right for day-to-day CI speed,
  # but it means a genuine resolution break (a missing extra, a version that
  # no longer exists on the index — exactly the class of bug behind #77/#80)
  # can hide behind a cache hit from before the break landed. This job is
  # the one place that's guaranteed to notice.
  clean-install:
    name: Clean install (no cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (cold)
        run: uv sync --all-packages

      - name: Smoke test import
        run: uv run python -c "import nullain, nullain_tools, nullain_agentd; print('ok')"

  # The test matrix spans all three platforms because the sandbox adapters
  # (landlock / seatbelt / Windows Job Object), the subprocess launcher and the
  # path-validation logic differ per OS — a green Linux run proves nothing
  # about the Windows Job Object adapter.
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      # The fail_under gate stays on the primary combination only (see
      # pyproject.toml's [tool.coverage.report] comment): a platform's
      # sandbox adapter (landlock/seatbelt/windows_job) is legitimately
      # unreachable on the other two OSes, so gating there would fail CI on
      # normal per-platform variation, not a real regression.
      #
      # Every platform still *measures* coverage (ungated) and uploads it as
      # a per-OS artifact — the merged report (see the coverage-combine job
      # below) is what actually proves the sandbox adapters are exercised
      # somewhere in the matrix, instead of just assuming it from a single
      # Linux run.
      - name: Pytest with coverage (gated)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Pytest with coverage (ungated)
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: uv run pytest --cov --cov-report=term
        continue-on-error: false

      - name: Rename coverage data file for this platform
        run: mv .coverage ".coverage.${{ matrix.os }}.${{ matrix.python-version }}"

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.${{ matrix.os }}.${{ matrix.python-version }}
          if-no-files-found: error
          # upload-artifact excludes dotfiles by default — the renamed data
          # file (.coverage.<os>.<py>) still starts with "." and was
          # silently uploaded as an empty artifact without this, which
          # `coverage combine` then had nothing to merge.
          include-hidden-files: true

  # Merges every platform's coverage data into one report so the sandbox
  # adapters (landlock on Linux, seatbelt on macOS, windows_job on Windows) —
  # each unreachable on the other two OSes — are all provably exercised
  # *somewhere* in the matrix, instead of the single-platform gated report
  # silently showing 0% for two of the three and nobody noticing.
  coverage-combine:
    name: Combine Coverage (all platforms)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Download all coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and report
        run: |
          uv run coverage combine
          uv run coverage report --show-missing
          uv run coverage html

      - name: Upload combined HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-combined
          path: htmlcov/
          if-no-files-found: error

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Pip audit
        run: uv run pip-audit

  # Runs the eval suite against recorded fixtures (no network, deterministic)
  # and uploads the report as an artifact. Deliberately informational, not
  # gated: the suite is new (issue #45) and hasn't proven stable enough to
  # block merges on yet — a PR author diffs the uploaded report against
  # evals/baselines/offline-baseline.json by hand for now. `continue-on-error`
  # keeps a task regression visible in the job summary without failing CI.
  evals:
    name: Evals (offline)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run offline eval suite
        run: PYTHONPATH=evals uv run python -m nullain_evals.cli offline

      - name: Run eval harness's own unit tests
        run: PYTHONPATH=evals uv run pytest evals/tests -v

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: evals/report.json
          if-no-files-found: error

  # Proves the three distributions actually build and that their metadata is
  # valid for PyPI. Catches a broken package long before a release is cut.
  build:
    name: Build & Verify Distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build all distributions
        run: |
          uv build --package nullain-sdk --out-dir dist
          uv build --package nullain-tools --out-dir dist
          uv build --package nullain-agentd --out-dir dist

      - name: Verify distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  # Installs what's actually LIVE on PyPI, from a fresh venv with no
  # checkout of this repo on sys.path — the scenario clean-install (above)
  # cannot cover, because it always installs from source. This is what
  # would have caught #77 (nullain-search's search-rust extra pointing at
  # a local path that only exists on a contributor's disk): that repo was
  # always internally consistent from source, so no from-source job would
  # have failed — only actually resolving the published extra from the
  # public index catches it. Runs on push to main/master (not PRs — a
  # PR's own code can't fix a broken public package) and daily via the
  # `schedule` trigger, since PyPI itself can break with zero commits here
  # (a yanked release, index downtime, a transitive dependency's breaking
  # publish). Not gated to any particular version — always installs
  # whatever `pip` resolves as latest, matching what a new user gets today.
  pypi-consumer-install:
    name: PyPI consumer install (published packages)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately no `actions/checkout` — this job must prove the
      # published packages work with nothing from this repo on disk, the
      # same starting point as `pip install nullain-sdk` on a machine that
      # has never cloned anything here.
      - name: Install nullain-sdk from PyPI
        run: pip install --no-cache-dir nullain-sdk

      - name: Smoke test public API surface
        run: |
          python -c "
          from nullain import Agent, AgentLoop, ToolRegistry, load_settings
          print('nullain-sdk public API import: ok')
          "

      - name: Install nullain-sdk[search-rust] from PyPI
        run: pip install --no-cache-dir "nullain-sdk[search-rust]"

      - name: Smoke test RustSearchAdapter import
        run: |
          python -c "
          from nullain.ports.search import RustSearchAdapter, SearchProvider
          assert issubclass(RustSearchAdapter, object)
          print('search-rust extra resolves and RustSearchAdapter imports: ok')
          "

      - name: Install nullain-search from PyPI directly
        run: pip install --no-cache-dir nullain-search

      - name: Smoke test SearchIndex end-to-end
        run: |
          python -c "
          import nullain_search
          idx = nullain_search.SearchIndex()
          idx.index('the quick brown fox', source='a.txt')
          hits = idx.query('fox', 5)
          assert hits and hits[0].source == 'a.txt', hits
          print('nullain-search SearchIndex index/query: ok')
          "
