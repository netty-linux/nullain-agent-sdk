[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nullain-agentd"
version = "0.1.0"
description = "NDJSON stdio daemon wrapper for Nullain Agent SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nullain-sdk",
    "nullain-tools",
    "pydantic>=2.7.0",
    "anyio>=4.3.0",
]

[project.scripts]
nullain-agentd = "nullain_agentd.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nullain_agentd"]
