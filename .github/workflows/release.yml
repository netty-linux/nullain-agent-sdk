name: Release

# Publishing is deliberately manual-or-tagged, never on every push: a release
# is irreversible (a version can never be re-uploaded to PyPI).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  # Never publish something that does not pass the full gate.
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

      - name: Pytest with coverage gate
        run: uv run pytest --cov --cov-report=term

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Order matters only for readability; each package builds independently.
      - name: Build all distributions
        run: |
          uv build --package nullain-sdk --out-dir dist
          uv build --package nullain-tools --out-dir dist
          uv build --package nullain-agentd --out-dir dist

      - name: Verify metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  # PyPI's trusted-publisher registration is keyed on (owner, repo, workflow,
  # environment) — NOT on the PyPI project name. Three packages published
  # from the same workflow file each need their OWN GitHub environment
  # (pypi-nullain-sdk / pypi-nullain-tools / pypi-nullain-agentd, and the
  # testpypi-* equivalents), or PyPI refuses the second/third registration
  # as a duplicate of the first. Hence one job per package below instead of
  # a single job publishing dist/* in bulk.

  publish-testpypi-sdk:
    name: Publish nullain-sdk to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi-nullain-sdk
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Remove other packages' artifacts
        run: find dist -type f ! -name 'nullain_sdk-*' -delete
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-testpypi-tools:
    name: Publish nullain-tools to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi-nullain-tools
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Remove other packages' artifacts
        run: find dist -type f ! -name 'nullain_tools-*' -delete
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-testpypi-agentd:
    name: Publish nullain-agentd to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi-nullain-agentd
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Remove other packages' artifacts
        run: find dist -type f ! -name 'nullain_agentd-*' -delete
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi-sdk:
    name: Publish nullain-sdk to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi-nullain-sdk
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Remove other packages' artifacts
        run: find dist -type f ! -name 'nullain_sdk-*' -delete
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-pypi-tools:
    name: Publish nullain-tools to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi-nullain-tools
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Remove other packages' artifacts
        run: find dist -type f ! -name 'nullain_tools-*' -delete
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-pypi-agentd:
    name: Publish nullain-agentd to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi-nullain-agentd
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Remove other packages' artifacts
        run: find dist -type f ! -name 'nullain_agentd-*' -delete
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
