[project]
name = "nullain-monorepo"
version = "0.1.0"
description = "Nullain Agent SDK Monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "nullain-sdk",
    "nullain-tools",
    "nullain-agentd",
]

[tool.uv.sources]
nullain-sdk = { workspace = true }
nullain-tools = { workspace = true }
nullain-agentd = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "hypothesis>=6.90.0",
    "ruff>=0.4.0",
    "pyright>=1.1.380",
    "pre-commit>=3.6.0",
    "pip-audit>=2.7.0",
    "typer>=0.12.0",
    # nullain-sdk's optional `signing` extra (Ed25519 plugin verification).
    # Installed in dev so the Ed25519Verifier tests in test_plugins.py
    # actually run instead of silently skipping (skipif not _HAS_CRYPTO) —
    # without it, the real signature-verification code path (the security
    # boundary for the whole plugin system) never executed in CI.
    "cryptography>=42.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"
]
ignore = [
    "S101", # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["nullain-sdk/src", "nullain-tools/src", "nullain-agentd/src", "tests"]
extraPaths = ["nullain-sdk/src", "nullain-tools/src", "nullain-agentd/src"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["nullain-sdk/src", "nullain-tools/src", "nullain-agentd/src"]

[tool.coverage.run]
source = ["nullain", "nullain_tools", "nullain_agentd"]
branch = true
omit = [
    # Launched as a separate process by the Windows sandbox adapter; its
    # coverage is not attributable to the parent test process.
    "*/tools/sandbox/adapters/_win_launcher.py",
]

[tool.coverage.report]
# Platform-specific sandbox adapters and optional-dependency import guards are
# unreachable on any single CI runner; excluding them keeps the gate honest
# rather than forcing tests that cannot run.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
]
show_missing = true
# Gate set just below the measured baseline (80%) so a genuine regression
# fails CI while normal per-platform variation (sandbox adapters differ by OS)
# does not. Raise it as coverage grows; never lower it to make a build pass.
fail_under = 78
