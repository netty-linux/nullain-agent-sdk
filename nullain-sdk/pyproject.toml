[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nullain-sdk"
version = "0.1.0"
description = "Production agentic framework for Python — model routing, plan/act/verify, fail-closed sandboxing, and provable subagent authority"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nullain" }]
keywords = [
    "agent",
    "ai",
    "llm",
    "ollama",
    "sdk",
    "agentic",
    "mcp",
    "sandbox",
    "coding-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "anyio>=4.3.0",
    "aiosqlite>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "rich>=13.7.0",
    "nullain-tools>=0.1.0",
    # structlog's ConsoleRenderer(colors=True) raises SystemError on Windows
    # without colorama installed to translate ANSI escapes for the console;
    # every other platform's terminal handles them natively.
    "colorama>=0.4.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Ed25519 signature verification for signed plugin manifests (P4.25). Optional:
# without it the loader's fail-closed default refuses signed plugins rather than
# loading them unverified. Unsigned plugins still load under require_signature=false.
signing = ["cryptography>=42.0.0"]

[project.urls]
Homepage = "https://github.com/netty-linux/nullain-agent-sdk"
Repository = "https://github.com/netty-linux/nullain-agent-sdk"
Documentation = "https://github.com/netty-linux/nullain-agent-sdk/tree/master/docs"
Issues = "https://github.com/netty-linux/nullain-agent-sdk/issues"

[project.scripts]
nullain = "nullain.cli:app"

[tool.uv.sources]
# Resolved from the sibling workspace member during local/editable installs
# (uv tool install --editable, `uv run` inside the monorepo). Once
# nullain-tools has its own PyPI release, a real version constraint on the
# `dependencies` entry takes over for `pip install nullain-sdk` installs.
nullain-tools = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nullain"]
